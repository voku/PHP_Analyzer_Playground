name: PR build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Validate package-lock root metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const root = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages?.[''];
          if (!root) throw new Error('Missing root package-lock metadata');
          for (const group of ['dependencies', 'devDependencies']) {
            const declared = manifest[group] || {};
            const locked = root[group] || {};
            for (const dependency of new Set([...Object.keys(declared), ...Object.keys(locked)])) {
              if (declared[dependency] !== locked[dependency]) {
                throw new Error(group + '.' + dependency + ': manifest=' + declared[dependency] + ', lock=' + locked[dependency]);
              }
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html
